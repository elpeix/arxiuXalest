volumes:
    logs:
        driver: local

services:
    slim:
        image: php-local:latest
        working_dir: /var/www
        command: php -S 0.0.0.0:8080 -t public
        environment:
            docker: "true"
        ports:
            - 8081:8080
        volumes:
            - .:/var/www
            - logs:/var/www/logs
        depends_on:
            - db
    db:
        image: mariadb:latest
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: arxiu
        ports:
            - 3309:3306
        volumes:
            - ./db_data:/var/lib/mysql

networks:
    default:
        driver: bridge
